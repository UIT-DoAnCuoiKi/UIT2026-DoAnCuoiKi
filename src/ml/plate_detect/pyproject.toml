[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plate_detect"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ultralytics==8.4.37",
    "opencv-python-headless",
    "numpy",
    "pyyaml",
    "onnxruntime",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["plate_detect*"]
